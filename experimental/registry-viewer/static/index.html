<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-PLC Registry</title>
<style>
[hidden] { display: none !important; }
:root {
  --bg: #f7f7f5; --panel: #ffffff; --text: #1f2328; --muted: #6a737d; --line: #e3e3de;
  --accent: #2f6fdb; --accent-soft: #e8f0fd;
  --active: #1a7f37; --active-soft: #e6f4ea; --completed: #57606a; --completed-soft: #eef0f2;
  --paused: #9a6700; --paused-soft: #fff4d6; --planned: #6f42c1; --planned-soft: #f1ebfb;
  --warn: #bc4c00; --warn-soft: #fff1e5; --danger: #cf222e; --bar: #d0d7de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #181c21; --text: #e6e8eb; --muted: #9aa4af; --line: #2a3038;
    --accent: #6ea8fe; --accent-soft: #1b2a41;
    --active: #56d364; --active-soft: #12301c; --completed: #a0a9b3; --completed-soft: #23282e;
    --paused: #e3b341; --paused-soft: #3a2e0f; --planned: #b392f0; --planned-soft: #2b2142;
    --warn: #ffa657; --warn-soft: #3b2412; --danger: #ff7b72; --bar: #30363d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
.meta { color: var(--muted); font-size: 12px; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.spacer { flex: 1; }
button, select, input[type=search] { font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
main { display: grid; grid-template-columns: minmax(340px, 44%) 1fr; gap: 0; min-height: calc(100vh - 54px); }
#list { border-right: 1px solid var(--line); overflow: auto; max-height: calc(100vh - 54px); }
#detail { overflow: auto; max-height: calc(100vh - 54px); padding: 16px 20px 40px; }
.filters { position: sticky; top: 0; background: var(--bg); padding: 10px 12px; display: flex; gap: 6px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); z-index: 2; }
.filters input[type=search] { flex: 1; min-width: 140px; }
.chip { border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chip[aria-pressed=true] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 7px 12px 7px calc(12px + var(--depth, 0) * 18px);
  border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--accent-soft); }
.row.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.row.ghost { opacity: .55; }
.row .t { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.row .sid { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: nowrap; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.row .p { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; width: 120px; flex: none; }
.bar > i { display: block; height: 100%; background: var(--active); }
.badge { font-size: 11px; border-radius: 4px; padding: 0 6px; white-space: nowrap; border: 1px solid transparent; }
.s-active { color: var(--active); background: var(--active-soft); }
.s-completed { color: var(--completed); background: var(--completed-soft); }
.s-paused { color: var(--paused); background: var(--paused-soft); }
.s-cancelled { color: #a40e26; background: #ffebe9; }
.s-planned { color: var(--planned); background: var(--planned-soft); }
.warn { color: var(--warn); background: var(--warn-soft); }
.cls { color: var(--accent); background: var(--accent-soft); }
.clsrow { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.lock { color: var(--muted); border-color: var(--line); }
.memb { color: var(--text); background: var(--panel); border-color: var(--line); }
.memb.rel { color: var(--muted); border-style: dashed; }
.grp { display: flex; gap: 6px; align-items: baseline; padding: 6px 12px 6px calc(12px + var(--depth, 0) * 18px);
  border-bottom: 1px solid var(--line); background: var(--panel); position: relative; }
.grp.g0 { background: var(--accent-soft); font-size: 13px; }
.grp.g1 { font-size: 13px; color: var(--text); }
.grp .caret { cursor: pointer; }
.grp .cnt { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.caret { width: 14px; color: var(--muted); display: inline-block; text-align: center; }
h2 { font-size: 18px; margin: 4px 0 2px; }
.goal { white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 12px 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--completed-soft); padding: 1px 5px; border-radius: 4px; }
.copyline { display: flex; gap: 6px; align-items: center; }
.copyline code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
section { margin-top: 18px; }
section h3 { font-size: 14px; margin: 0 0 6px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.mono { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
tr.mismatch td { background: var(--warn-soft); }
.ops { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 12px; }
.issues li { margin: 4px 0; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.legend { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 24px; border-top: 1px solid var(--line); padding-top: 10px; }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--text); max-width: 560px; width: calc(100% - 32px); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog ul { padding-left: 18px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.on { opacity: 1; }
#toast.err { background: var(--danger); color: #fff; }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; }
  #list, #detail { max-height: none; border-right: 0; }
  #list { border-bottom: 1px solid var(--line); max-height: 50vh; }
}
</style>
</head>
<body>
<header>
  <h1>AI-PLC Registry <span class="badge lock" id="ver" data-testid="header-version"></span></h1>
  <span class="badge warn" id="modeBadge" hidden data-testid="header-mode"></span>
  <div class="counts" id="counts" data-testid="header-counts"></div>
  <span class="spacer"></span>
  <span class="meta" id="asof" data-testid="header-asof"></span>
  <label class="meta" id="shareLabel"><input type="checkbox" id="share" data-testid="header-share-toggle"> 画面共有モード</label>
  <button id="reload" data-testid="header-reload-button">再読み込み</button>
</header>
<main id="registryMain">
  <div id="list">
    <div class="filters">
      <input type="search" id="q" placeholder="scope_id・名前で絞り込み" data-testid="filter-search-input">
      <label class="note">並び順 <select id="sortOrder" data-testid="sort-order" aria-label="Projectの並び順"><option value="updated">更新順（新しい順）</option><option value="started">開始日順（従来）</option><option value="id">ID順</option></select></label>
      <label class="note" id="groupModeLabel" hidden>表示 <select id="groupMode" data-testid="group-mode" aria-label="一覧のまとめ方"><option value="tree">親子ツリー</option><option value="program">Program別</option></select></label>
      <span id="statusChips"></span>
      <button class="chip" id="issuesOnly" aria-pressed="false" data-testid="filter-issues-chip">食い違いあり</button>
      <span id="clsFilters" hidden>
        <select id="fAff" data-testid="filter-affiliation" title="所属"></select>
        <select id="fKind" data-testid="filter-kind" title="種類"></select>
        <select id="fExec" data-testid="filter-executor" title="実行環境"></select>
      </span>
    </div>
    <p class="note" id="activityNotice" style="padding:0 14px" data-testid="activity-notice"></p>
    <div id="rows" data-testid="project-list"></div>
  </div>
  <div id="detail" data-testid="project-detail"><div class="empty">左の一覧から Project を選んでください</div></div>
</main>
<div id="toast" role="status"></div>
<script>
"use strict";
const TOKEN = "__VIEWER_TOKEN__";
const STATUSES = ["active", "planned", "paused", "completed", "cancelled"];
const st = { data: null, sel: null, filter: new Set(["active"]), issuesOnly: false, q: "", collapsed: new Set(),
  cls: { affiliation: "", kind: "", executor: "" },
  share: false, detail: null, sort: "updated", group: "tree" };
try { const saved = JSON.parse(localStorage.getItem("rv-prefs") || "{}");
  if (["updated", "started", "id"].includes(saved.sort)) st.sort = saved.sort;
  if (["tree", "program"].includes(saved.group)) st.group = saved.group;
  if (Array.isArray(saved.filter)) st.filter = new Set(saved.filter); st.share = !!saved.share;
  if (saved.cls && typeof saved.cls === "object") st.cls = Object.assign(st.cls, saved.cls); } catch (e) {}
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function savePrefs() { try { localStorage.setItem("rv-prefs", JSON.stringify({ filter: [...st.filter], share: st.share, cls: st.cls, sort: st.sort, group: st.group })); } catch (e) {} }
const EXECUTORS = ["claude-code", "codex", "cursor"];
const NONE = "__none__";
// 分類の表示名。機密の所属は画面共有モードでは「機密」にする
function clsLabel(c) {
  if (!c || !c.key) return null;
  if (c.confidential && st.share) return "機密";
  return c.label || c.key;
}
function clsBadges(p) {
  const c = p.classification;
  if (!c || masked(p)) return "";  // 画面共有モードで行ごと伏せる Project は分類も出さない
  const parts = [];
  const a = clsLabel(c.affiliation), k = clsLabel(c.kind);
  if (a) parts.push(`<span class="badge cls" title="所属">${esc(a)}</span>`);
  if (k) parts.push(`<span class="badge cls" title="種類">${esc(k)}</span>`);
  if (c.executors.length) parts.push(`<span class="badge cls" title="実行環境">${esc(c.executors.join("・"))}</span>`);
  return parts.join("");
}
function renderClsFilters() {
  const on = !!st.data.classification_available;
  $("clsFilters").hidden = !on;
  if (!on) return;
  // ブラウザに保存したキーが語彙から消えていたら「すべて」に戻す（見えない絞り込みを残さない）
  for (const axis of ["affiliation", "kind"]) {
    const k = st.cls[axis];
    if (k && k !== NONE && !st.data.vocab[axis].some((e) => e.key === k)) st.cls[axis] = "";
  }
  if (st.cls.executor && st.cls.executor !== NONE && !EXECUTORS.includes(st.cls.executor)) st.cls.executor = "";
  const opt = (v, text, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(text)}</option>`;
  const vocabOpts = (axis, title) => [opt("", `${title}: すべて`, st.cls[axis]), opt(NONE, `${title}: 未設定`, st.cls[axis]),
    ...st.data.vocab[axis].map((e) => opt(e.key, `${title}: ${e.confidential && st.share ? `機密（${e.key}）` : e.label}`, st.cls[axis]))].join("");
  $("fAff").innerHTML = vocabOpts("affiliation", "所属");
  $("fKind").innerHTML = vocabOpts("kind", "種類");
  $("fExec").innerHTML = [opt("", "実行環境: すべて", st.cls.executor), opt(NONE, "実行環境: 未設定", st.cls.executor),
    ...EXECUTORS.map((e) => opt(e, `実行環境: ${e}`, st.cls.executor))].join("");
  for (const [id, axis] of [["fAff", "affiliation"], ["fKind", "kind"], ["fExec", "executor"]]) {
    $(id).onchange = (ev) => { st.cls[axis] = ev.target.value; savePrefs(); renderList(); };
  }
}
function toast(msg, err) { const t = $("toast"); t.textContent = msg; t.className = "on" + (err ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.className = ""), err ? 6000 : 2500); }
const masked = (p) => st.share && p.confidential;
const label = (p) => masked(p) ? p.hash_id : p.scope_id;
const pname = (p) => masked(p) ? "（機密のため非表示）" : p.name;
// Program・業務Project。画面共有モードでは、私生活（private）の Program 名をコードにし、業務Project は名前を出さず BIZ-xxxx だけにする
const progName = (g) => !g ? "" : st.share && g.sensitive ? g.masked : g.name;
const bizName = (b) => !b ? "" : st.share ? b.display_id : `${b.display_id} ${b.name}`;
const grouping = () => st.group === "program" && !!st.data.membership;
const badge = (s) => `<span class="badge s-${esc(s)}">${esc(s)}</span>`;
function pct(pr) { return pr.total ? Math.round((pr.done / pr.total) * 100) : null; }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ ok: false, error: `HTTP ${r.status}` }));
  if (!r.ok) { const e = new Error(j.error || `HTTP ${r.status}`); e.body = j; e.status = r.status; throw e; }
  return j;
}


async function load(keepSel) {
  $("rows").innerHTML = '<div class="empty">読み込み中…</div>';
  try { st.data = await api("/api/projects"); }
  catch (e) { $("rows").innerHTML = `<div class="empty">読み込みに失敗しました: ${esc(e.message)}</div>`; return; }
  renderHeader(); renderList();
  if (keepSel && st.sel) openDetail(st.sel);
}

function renderHeader() {
  const c = st.data.counts;
  $("ver").textContent = st.data.version || "";
  const ro = st.data.viewer_mode === "readonly", noAudit = !st.data.audit_available;
  $("modeBadge").hidden = !ro;
  $("modeBadge").textContent = ro ? "閲覧のみ" : "";
  $("modeBadge").title = st.data.viewer_mode_reason || "";
  // 機密判定（status_audit）か分類（機密の所属）のどちらかがあれば、画面共有モードを出す
  $("shareLabel").hidden = noAudit && !st.data.classification_available && !st.data.membership;
  $("issuesOnly").hidden = noAudit;
  renderClsFilters();
  $("counts").innerHTML = STATUSES.map((s) => `<span class="badge s-${s}">${s} ${c.by_status[s] || 0}</span>`).join("") +
    (c.issues ? `<span class="badge warn" title="aiplc_status_audit の候補数">食い違い ${c.issues}</span>` : "");
  $("asof").textContent = `DB更新 ${st.data.db_mtime.replace("T", " ")} ／ 読込 ${st.data.generated_at.slice(11)}`;
  $("statusChips").innerHTML = STATUSES.map((s) =>
    `<button class="chip" data-s="${s}" aria-pressed="${st.filter.has(s)}" data-testid="filter-status-${s}">${s}</button>`).join("");
  $("statusChips").querySelectorAll("button").forEach((b) => b.onclick = () => {
    const s = b.dataset.s; st.filter.has(s) ? st.filter.delete(s) : st.filter.add(s); savePrefs(); renderHeader(); renderList(); });
  $("issuesOnly").setAttribute("aria-pressed", st.issuesOnly);
  $("share").checked = st.share;
  $("sortOrder").value = st.sort;
  $("groupModeLabel").hidden = !st.data.membership;
  $("groupMode").value = st.group;
  $("activityNotice").textContent = st.data.activity_notice || "更新情報未確認。再読み込みしてください。";
}

function tree(list = st.data.projects) {
  const by = new Map(list.map((p) => [p.scope_id, p]));
  const kids = new Map();
  const roots = [];
  for (const p of list) {
    const par = p.parent_scope && by.has(p.parent_scope) && p.parent_scope !== p.scope_id ? p.parent_scope : null;
    if (par) { if (!kids.has(par)) kids.set(par, []); kids.get(par).push(p); } else roots.push(p);
  }
  const byId = (x, y) => x.scope_id.localeCompare(y.scope_id, "en", { numeric: true });
  const effective = new Map();
  // Only matching descendants affect ordering; preserve the parent/child layout.
  const collect = (p) => {
    let recent = matches(p) ? p : null;
    for (const c of kids.get(p.scope_id) || []) {
      const candidate = collect(c);
      if (candidate && (!recent || activityCompare(candidate, recent) < 0)) recent = candidate;
    }
    effective.set(p.scope_id, recent); return recent;
  };
  for (const p of roots) collect(p);
  const sortFn = st.sort === "started" ? (a, b) => (b.start_date || "").localeCompare(a.start_date || "") || byId(b, a)
    : st.sort === "id" ? byId
    : (a, b) => activityCompare(effective.get(a.scope_id), effective.get(b.scope_id)) || byId(a, b);
  roots.sort(sortFn);
  for (const v of kids.values()) v.sort(st.sort === "started" ? byId : sortFn);
  return { roots, kids, effective };
}

function activityCompare(a, b) {
  const rank = (p) => ({local_save: 0, created: 1})[p?.activity?.kind] ?? 2;
  const stamp = (p) => Number.isFinite(p?.activity?.epoch_ms) ? p.activity.epoch_ms : 0;
  return rank(a) - rank(b) || stamp(b) - stamp(a);
}
function activityText(p) {
  if (masked(p)) return "更新情報は非表示";
  const a = p.activity;
  if (!a || !a.at) return "更新未確認";
  const at = a.at.replace("T", " ").replace("+09:00", " JST");
  return `${a.kind === "local_save" ? "保存" : "作成（更新未確認）"} ${at} · ${a.source}${a.precision === "day" ? "・日単位" : ""}${a.warnings?.length ? "・一部未確認" : ""}`;
}

function matches(p) {
  if (!st.filter.has(p.status)) return false;
  if (st.issuesOnly && !p.issues && !p.status_mismatch) return false;
  const c = p.classification;
  if (c) {
    for (const axis of ["affiliation", "kind"]) {
      const want = st.cls[axis];
      if (want === NONE && c[axis].key) return false;
      if (want && want !== NONE && c[axis].key !== want) return false;
    }
    // 実行環境: Layer の executor とタスクの executed_by を合わせた集合のどれかに一致
    if (st.cls.executor === NONE && c.executors.length) return false;
    if (st.cls.executor && st.cls.executor !== NONE && !c.executors.includes(st.cls.executor)) return false;
  }
  if (st.q) { const q = st.q.toLowerCase();
    const m = p.membership;
    const memb = m && !masked(p) ? [progName(m.program), bizName(m.primary_business), ...m.related_business.map(bizName)].join(" ") : "";
    const hay = (label(p) + " " + (masked(p) ? "" : p.name + " " + p.scope_id) + " " + memb).toLowerCase();
    if (!hay.includes(q)) return false; }
  return true;
}

function membershipRow(p) {
  const m = p.membership;
  if (!m || masked(p)) return "";
  const parts = [];
  if (!grouping()) {
    if (m.program) parts.push(`<span class="badge memb" title="Program">${esc(progName(m.program))}</span>`);
    if (m.primary_business) parts.push(`<span class="badge memb" title="主な業務Project">${esc(bizName(m.primary_business))}</span>`);
  }
  for (const b of m.related_business) parts.push(`<span class="badge memb rel" title="関連する業務Project（件数には入れない）">関連: ${esc(bizName(b))}</span>`);
  return parts.length ? `<div class="clsrow" data-testid="project-membership"><span class="caret"></span>${parts.join("")}</div>` : "";
}

function renderList() {
  const out = [];
  if (grouping()) renderGroups(out); else renderProjects(st.data.projects, 0, out);
  $("rows").innerHTML = out.length ? out.join("") : '<div class="empty">条件に合う Project はありません</div>';
  $("rows").querySelectorAll(".row, .grp").forEach((el) => el.onclick = (ev) => {
    const tg = ev.target.closest("[data-toggle]");
    if (tg && tg.textContent) { const s = tg.dataset.toggle; st.collapsed.has(s) ? st.collapsed.delete(s) : st.collapsed.add(s); renderList(); return; }
    if (el.dataset.sid) openDetail(el.dataset.sid);
  });
}

// Program → 業務Project(primary) → Project。グループ内では parent_scope の入れ子を保つ（親が別グループならグループ内の最上位）
function renderGroups(out) {
  const UNL = "__unlinked__", NOBIZ = "__nobiz__", CONF = "__confidential__";
  const progs = new Map((st.data.membership.programs || []).map((g) => [g.uid, g]));
  const groups = new Map();
  for (const p of st.data.projects) {
    // 共有モードの 🔒 Project はグループの位置からも所属が分からないよう、まとめて別グループにする
    const m = masked(p) ? null : p.membership;
    const gk = masked(p) ? CONF : m && m.program ? m.program.uid : (m && m.primary_business ? NOBIZ + "prog" : UNL);
    const bk = m && m.primary_business ? m.primary_business.uid : NOBIZ;
    if (!groups.has(gk)) groups.set(gk, new Map());
    const g = groups.get(gk);
    if (!g.has(bk)) g.set(bk, { biz: m && m.primary_business, list: [] });
    g.get(bk).list.push(p);
  }
  const hits = (list) => list.filter(matches).length;
  const order = [...groups.entries()].map(([k, bmap]) => ({ k, bmap, n: [...bmap.values()].reduce((a, b) => a + hits(b.list), 0) }))
    .sort((a, b) => (a.k === CONF) - (b.k === CONF) || (a.k === UNL) - (b.k === UNL) || b.n - a.n || progName(progs.get(a.k)).localeCompare(progName(progs.get(b.k)), "ja"));
  for (const { k, bmap, n } of order) {
    if (!n) continue;
    const key = "g:" + k, col = st.collapsed.has(key), g = progs.get(k);
    const title = k === CONF ? "機密（画面共有モードのため所属は非表示）" : k === UNL ? "未紐付け（Program・業務Project 未設定）" : g ? progName(g) : "Program 未設定（業務Project のみ）";
    out.push(`<div class="grp g0" style="--depth:0" data-testid="group-program"><span class="caret" data-toggle="${esc(key)}">${col ? "▸" : "▾"}</span>
      <b>${esc(title)}</b><span class="cnt">${n}件</span></div>`);
    if (col) continue;
    const bizOrder = [...bmap.entries()].map(([bk, v]) => ({ bk, v, n: hits(v.list) })).filter((x) => x.n)
      .sort((a, b) => (a.bk === NOBIZ) - (b.bk === NOBIZ) || b.n - a.n || a.v.biz.display_id.localeCompare(b.v.biz.display_id));
    for (const { bk, v, n: bn } of bizOrder) {
      if (k === UNL || k === CONF) { renderProjects(v.list, 1, out); continue; }
      const bkey = key + "/" + bk, bcol = st.collapsed.has(bkey);
      out.push(`<div class="grp g1" style="--depth:1" data-testid="group-business"><span class="caret" data-toggle="${esc(bkey)}">${bcol ? "▸" : "▾"}</span>
        ${esc(bk === NOBIZ ? "業務Project なし（Program に直接所属）" : bizName(v.biz))}<span class="cnt">${bn}件</span></div>`);
      if (!bcol) renderProjects(v.list, 2, out);
    }
  }
}

function renderProjects(list, base, out) {
  const { roots, kids, effective } = tree(list);
  const visit = (p, depth) => {
    const ch = kids.get(p.scope_id) || [];
    const childHtml = [];
    let childHit = false;
    const saveLen = out.length;
    for (const c of ch) { const hit = visit(c, depth + 1); childHit = childHit || hit; }
    const sub = out.splice(saveLen);
    const self = matches(p);
    if (!self && !childHit) return false;
    const col = st.collapsed.has(p.scope_id);
    const pr = p.progress, pc = pct(pr);
    out.push(`<div class="row${st.sel === p.scope_id ? " sel" : ""}${self ? "" : " ghost"}" style="--depth:${base + depth}" data-sid="${esc(p.scope_id)}" data-testid="project-row">
      <div class="t"><span class="caret" data-toggle="${esc(p.scope_id)}">${ch.length ? (col ? "▸" : "▾") : ""}</span>
        <span class="sid">${esc(label(p))}</span><span class="nm">${esc(pname(p))}</span></div>
      <div class="r">${p.confidential ? '<span class="badge lock" title="機密判定（status_audit と同じ基準・機密の所属を含む）">🔒</span>' : ""}
        ${p.status_mismatch ? '<span class="badge warn" title="intent と Registry の status が違う">status差</span>' : ""}
        ${p.issues ? `<span class="badge warn" title="aiplc_status_audit の候補">食い違い ${p.issues}</span>` : ""}
        ${badge(p.status)}</div>
      <div class="p"><span class="caret"></span>${pc === null ? "タスクなし" :
        `<span class="bar"><i style="width:${pc}%"></i></span>${pr.done}/${pr.total}（${pc}%）`}
        ${p.layer_path ? "" : '<span title="Layer フォルダが見つからない">Layerなし</span>'}
        ${p.deadline ? `<span>期限 ${esc(p.deadline)}</span>` : ""}</div>
      <div class="clsrow note" data-testid="project-activity"><span class="caret"></span>${esc(activityText(p))}${!masked(p) && st.sort === "updated" && effective.get(p.scope_id) && effective.get(p.scope_id) !== p ? `<span> ／ グループ順位: ${esc(label(effective.get(p.scope_id)))} · ${esc(activityText(effective.get(p.scope_id)))}</span>` : ""}</div>
      ${clsBadges(p) ? `<div class="clsrow"><span class="caret"></span>${clsBadges(p)}</div>` : ""}${membershipRow(p)}</div>`);
    if (!col) out.push(...sub);
    return true;
  };
  for (const r of roots) visit(r, 0);
}

async function openDetail(sid) {
  st.sel = sid; renderList();
  $("detail").innerHTML = '<div class="empty">読み込み中…</div>';
  let d;
  try { d = await api(`/api/projects/${encodeURIComponent(sid)}`); }
  catch (e) { $("detail").innerHTML = `<div class="empty">読み込みに失敗しました: ${esc(e.message)}</div>`; return; }
  st.detail = d; renderDetail();
}

function renderDetail() {
  const d = st.detail, m = st.share && d.confidential;
  const pr = d.progress, pc = pct(pr);
  const sched = d.tasks.some((t) => t.scheduled_for || t.due || t.recurrence);
  const byId = new Map(st.data.projects.map((p) => [p.scope_id, p]));
  const link = (s) => { const p = byId.get(s); return p ? `<a href="#" data-go="${esc(s)}">${esc(label(p))}</a>` : esc(s); };
  const copy = (text, tid) => `<span class="copyline"><code>${esc(text)}</code><button data-copy="${esc(text)}" data-testid="${tid}">コピー</button></span>`;
  $("detail").innerHTML = `
    <div class="note">${m ? esc(d.hash_id) : esc(d.scope_id)} ${d.confidential ? "🔒" : ""}</div>
    <h2 data-testid="detail-title">${m ? "（機密のため非表示）" : esc(d.name)}</h2>
    <div class="goal" data-testid="detail-goal">${m ? "（機密のため非表示）" : esc(d.goal || "（goal なし）")}</div>
    <dl class="kv">
      <dt>status</dt><dd>${badge(d.status)} <span class="note">intent: ${esc(d.intent_status ?? "—")}${d.summary_status ? ` ／ backlog summary: ${esc(d.summary_status)}` : ""}</span>
        ${d.status_mismatch ? '<span class="badge warn">intent と Registry が違う</span>' : ""}
        ${d.duplicate_folder ? '<span class="badge warn">同じ scope_id のフォルダが複数あります（最初の1つを表示）</span>' : ""}</dd>
      <dt>進捗</dt><dd>${pc === null ? "タスクなし" : `<span class="ops"><span class="bar"><i style="width:${pc}%"></i></span>${pr.done}/${pr.total}（${pc}%・${pr.source === "backlog" ? "backlog.yaml" : "Registry"} 基準）</span>`}</dd>
      <dt>depth / mode</dt><dd>${esc(d.depth)} / ${esc(d.mode)}</dd>
      ${d.classification && m ? '<dt>分類</dt><dd>（機密のため非表示）</dd>' : ""}
      ${d.classification && !m ? `<dt>分類</dt><dd>所属: ${esc(clsLabel(d.classification.affiliation) || "未設定")} ／ 種類: ${esc(clsLabel(d.classification.kind) || "未設定")} ／ 実行環境: ${esc(d.classification.executors.join("・") || "未設定")}
        <span class="note">（変えるときは intent.yaml の classification を直して classify.py sync）</span></dd>` : ""}
      <dt>作業記録の更新</dt><dd data-testid="detail-activity">${esc(activityText(d))}${m ? "" : `<div class="note">根拠: ${esc(d.activity?.path || d.activity?.source || "不明")}<br>${esc(d.activity_notice || "")}${d.activity?.warnings?.length ? `<br>未確認: ${esc(d.activity.warnings.join(" / "))}` : ""}</div>`}</dd>
      <dt>期間</dt><dd>${esc(d.start_date || "—")} 〜 ${esc(d.deadline || "—")}</dd>
      ${d.membership_available ? `<dt>所属</dt><dd data-testid="detail-membership">${m ? "（機密のため非表示）" : !d.membership ? '<span class="note">未紐付け（Program・業務Project 未設定）</span>' : `
        <div>Program: ${d.membership.program ? esc(progName(d.membership.program)) + (d.membership.program_source === "business" ? ' <span class="note">（主な業務Project 経由）</span>' : "") : "—"}</div>
        <div>主な業務Project: ${d.membership.primary_business ? esc(bizName(d.membership.primary_business)) : "—"}</div>
        <div>関連する業務Project: ${d.membership.related_business.length ? d.membership.related_business.map((b) => esc(bizName(b))).join("、") : "—"}</div>
        <div class="note">業務Project の所属は下の「親・子」（AI-PLC の親子）とは別です。紐付けを変えるときは <code>business_registry.py link</code> / <code>unlink</code> で</div>`}</dd>` : ""}
      <dt>親</dt><dd>${d.parent_scope ? link(d.parent_scope) : "—"}</dd>
      <dt>子</dt><dd>${d.children.length ? d.children.map(link).join("、") : "—"}</dd>
      <dt>Layer</dt><dd>${d.layer_path ? (m ? "（機密のため非表示）" : copy(d.layer_path, "detail-layer-copy")) : '<span class="badge warn">Layer フォルダが見つかりません</span>'}</dd>
      <dt>起動</dt><dd>${d.launch_prompt ? (m ? "（機密のため非表示）" : copy(d.launch_prompt, "detail-prompt-copy")) : "—"}</dd>
    </dl>
    <section>
      <h3>Projectの状態</h3>
      <p class="note" data-testid="viewer-readonly">このビューアは閲覧専用です。status の変更は <code>/plc-lifecycle</code>（中止・再開）や各 Stage の実行（<code>/04-operation</code> など）で行います。</p>
      ${d.status === "cancelled" ? `<p class="note">中止済み（Goal未達の終了）。Task実績と成果物は保持されています。再開するときは <code>/plc-lifecycle</code> で再計画と承認を経ます。</p>` : ""}
      ${d.cancellation ? `<p data-testid="project-cancellation-record">${m ? "（機密のため中止判断は非表示）" : `中止理由: ${esc(d.cancellation.reason)} / 判断: ${esc(d.cancellation.decided_at)} / 承認: ${esc(d.cancellation.approved_by)} (${esc(d.cancellation.approval_ref)}) / 保持成果: ${esc((d.cancellation.retained_artifacts || []).join("、"))} / 置換先: ${esc(d.cancellation.replacement_scope_id || "なし")} / 再検討: ${esc(d.cancellation.reconsider_when || "未指定")}`}</p>` : ""}
    </section>
    <section>
      <h3>タスク（${d.tasks.length}）</h3>
      ${d.tasks.length ? `<table data-testid="task-table"><thead><tr><th>ID</th><th>名前</th><th>pri</th><th>backlog</th><th>Registry</th>${sched ? "<th>実行時期・期限</th>" : ""}${d.classification_available ? "<th>実行環境</th>" : ""}</tr></thead><tbody>
      ${d.tasks.map((t) => `<tr class="${t.mismatch ? "mismatch" : ""}" data-testid="task-row">
        <td class="mono">${esc(t.task_id)}</td><td>${m ? "—" : esc(t.name)}</td><td class="mono">${esc(t.priority ?? "")}</td>
        <td class="mono">${t.in_layer ? esc(t.layer_status ?? "—") : '<span class="note">なし</span>'}</td>
        <td class="mono">${t.in_registry ? esc(t.registry_status) : '<span class="note">なし</span>'}</td>
        ${sched ? `<td class="mono" data-testid="task-schedule">${t.recurrence ? `<span class="badge cls" title="運用タスク（進捗の数に入れない）">運用・${esc(typeof t.recurrence === "string" ? t.recurrence : "あり")}</span> ` : ""}${t.scheduled_for ? `時期 ${esc(t.scheduled_for)}` : ""}${t.scheduled_for && t.due ? " ／ " : ""}${t.due ? `期限 ${esc(t.due)}` : ""}${!t.recurrence && !t.scheduled_for && !t.due ? "—" : ""}</td>` : ""}
        ${d.classification_available ? `<td class="mono">${esc(t.executed_by || "—")}</td>` : ""}
        </tr>`).join("")}
      </tbody></table>
      <p class="note">色つきの行は backlog と Registry の値が対応していないタスクです。運用タスク（recurrence のあるタスク）は進捗の数に入れません。</p>` : '<p class="note">タスクはありません</p>'}
    </section>
    <section>
      <h3>食い違い（aiplc_status_audit）</h3>
      ${!d.audit_available ? '<p class="note">aiplc_status_audit.py が無いため表示しません</p>' : d.issues.length ? `<ul class="issues">${d.issues.map((i) => `<li><span class="badge warn">${esc(i.kind)}</span> ${m ? "（機密のため理由は非表示）" : esc(i.reason)}</li>`).join("")}</ul>
        <p class="note">反映は <code>python3 ${esc(st.share ? "aiplc_status_audit.py" : (d.audit_path || "aiplc_status_audit.py"))} --quiet --approval-template --layer &lt;Layer&gt;</code> から（承認つき）</p>` : '<p class="note">食い違いはありません</p>'}
    </section>
    <div class="legend"><b>読み方</b> ${STATUSES.map(badge).join("")}
      <span>進捗＝完了 / 対象（cancelled・deferred は除外）</span>
      ${d.audit_available ? '<span class="badge warn">食い違い</span><span>＝status_audit の候補</span><span class="badge lock">🔒</span><span>＝機密判定</span>' : ""}</div>`;
  $("detail").querySelectorAll("[data-go]").forEach((a) => a.onclick = (e) => { e.preventDefault(); openDetail(a.dataset.go); });
  $("detail").querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast("コピーしました"); } catch (e) { toast("コピーできませんでした", true); } });
}

function changeView() {
  // #<scope_id> で開いたときは、その Project の詳細を出す
  if (location.hash && st.data) {
    try { const sid = decodeURIComponent(location.hash.slice(1)); if (st.data.projects.some(p => p.scope_id === sid)) openDetail(sid); } catch (e) {}
  }
}
window.addEventListener("hashchange", changeView);
$("reload").onclick = () => load(true);
$("groupMode").onchange = (e) => { if (["tree", "program"].includes(e.target.value)) { st.group = e.target.value; savePrefs(); renderList(); } };
$("sortOrder").onchange = (e) => { if (["updated", "started", "id"].includes(e.target.value)) { st.sort = e.target.value; savePrefs(); renderList(); } };
$("q").oninput = (e) => { st.q = e.target.value.trim(); renderList(); };
$("issuesOnly").onclick = () => { st.issuesOnly = !st.issuesOnly; renderHeader(); renderList(); };
$("share").checked = st.share;
$("share").onchange = (e) => {
  st.share = e.target.checked; savePrefs();
  if (st.data) { renderHeader(); renderList(); }
  if (st.detail) renderDetail();
};
load(false).then(changeView);
</script>
</body>
