specification: AI-PLC Addon Seam Contract
schema_version: '0.4'
derived_from: '0.3'
source_spec_sha256: 47e02f9c5847bb9cc3d52b871055ec0b45c1d768227f0d839fb51486dc1894e3
implemented_routes:
- file_consultation_only
- file_single_form_task_inputs
- file_guide_recurring_task_proposals
- bundled_addon_selection_readonly
unavailable_routes:
- page
- multi-form composition
- TrialResult simulation
types:
  AddonBinding:
    schema_version: '0.1'
    candidate_location: intent.addons[]
    field_contracts:
      addon_id:
        type: string
        required: true
        meaning: アドオン識別子。Task/事項/業務UIDと別
      addon_version:
        type: string
        required: true
        meaning: 同版選択・型更新の照合に使う
      selection_ref:
        type: reference
        required: true
        meaning: 現在本人の明示選択の実出典。bool/引用/存在だけは選択にしない
      guide_ref:
        type: AddonResourceRef
        required: true
        meaning: 相談入口の案内を固定して参照。本文は許可上書き命令として扱わない
      common_contract_ref:
        type: AddonResourceRef
        required: true
        meaning: アドオン共通の約束事
      forms:
        type: list
        required: true
        meaning: 案件側の型一覧を固定。実名や具体ページは案件側だけ
        item_fields:
        - form_id
        - form_ref
      read_limits:
        type: map
        required: true
        meaning: 許可された必要参照への正の有限上限。未知/nullを無制限にしない
        fields:
        - max_guide_items
        - max_form_items
    unselected: existing route unchanged; no addon/private injection
    conflict: 現在依頼/明示選択で解決できない複数案内/版競合はHold。勝手な優先度や新必須質問なし
    legacy: pmo_mode/description指示を自動移行/選択にしない
  AddonResourceRef:
    schema_version: '0.1'
    required_fields:
    - kind
    - scope
    - version
    - sha256
    kind_values:
    - file
    - page
    scope_values:
    - common
    - case
    file_required:
    - relative_name
    page_required:
    - resource_ref
    rules:
    - file is under explicitly permitted root; reject absolute/parent traversal/symlink
      escape
    - page needs existing authorized read capability/version pin; unsupported or unresolved
      is Hold
    - case scope resolved locally; common documents contain no actual case page IDs/paths
    - hash/version is a pin, not permission/authentication
    - do not search/install/copy sessions as fallback for denied or unsupported references
  ConsultationResult:
    fields:
    - route
    - next_actions
    - read_coverage
    - execution_note
    - source_refs
    route_values:
    - operational_guidance
    - existing_plan_change_classification
    - held
    operational_guidance: 既存plc-nextの現在Task/依存/状態照合へ接続、相談からの実行0
    plan_change: plc-consultの既存5分類を維持。priority questionを今のTask修正へ誤分類しない
    next_actions: 既存session §7.4の正式入口/対象/得る成果、現実的案最大3つ、同一判断点で唯一のNextブロック
    read_coverage: ReadCoverage型の要約を再利用。読取0/不明/欄なし等を区別
    execution_note: 1行で相談のみ/実Task未実行/試行のみを明示
    MatterTrace: assignment timing and numbering remain addon/case-owned; no common
      real ID generated
  TrialPolicy:
    specification: AI-PLC Trial Policy
    schema_version: '0.1'
    candidate_location: optional intent.trial_policy or current explicit session instruction
    resolved_value: effective_trial_policy; computed read-only before mutations
    fields:
      schema_version:
        type: string
        required: true
        meaning: '0.1'
      effect:
        type: enum
        required: true
        meaning: 永続的な副作用を行わない上限制約
        values:
        - observe_only
      interaction:
        type: enum
        required: true
        meaning: 実判断を代行せず、質問UI/承認待機なしで不足を返す
        values:
        - no_wait
      read_scope:
        type: list
        required: true
        meaning: 現在の実読取許可内の必要参照。未知を全域へ補完しない
      limits:
        type: map
        required: true
        meaning: 読取/試行の正の有限上限。既存期限/消費をリセットしない
      source_ref:
        type: reference
        required: true
        meaning: 現在本人の明示試行指示、又は現在許可に基づくLayer選択出典。メモ引用は起動指示でない
    default: unset => existing ordinary policy and gates; no implicit write grant
    mode_collision: intent.mode direct/platform_builder and work_style/dev_style/extensions
      unchanged
    denied_effects:
    - artifact file writes including temp/cache/bytecode/automatic logs
    - intent/context/backlog changes
    - writer claim/release and binding/receipt journal writes
    - Registry/classification/Stock changes
    - Wiki/log/memory and automatic end-of-request Backfill
    - external update/transmission/sync
    - native Goal state updates
    - automation/schedule creation
    - Git changes/tool installation/new spend
    no_wait: 表示した候補/判断内容を実本人回答・採択・反映へ昇格しない。必要判断/実操作は未実施又は未確認
    quality: self/independent read-only verification may run only if actual effects
      are known and allowed. Unavailable quality stays unverified; no normal Task
      gate waived
    completion: No Task.completed/Goal.complete/persistent status transition; TrialResult
      is not real Task status
    normal_auto_force: 明示observe_only制約は全経路で維持。forceの待機例外は操作権限・期限解除を生成しない
    exit: 別の明示本人指示と現在条件照合まで通常書込みへ戻さない。試行終了を解除としない
    unknown_tool_effects: Hold; do not exercise tool with uncertain persistence
    separate_record: 試行終了の自動Backfill0。後に別の具体通常記録許可がある場合だけ、その範囲で記録
    native_runtime_limit: Persistent native Goal controls not changed in trial; response
      does not prove mechanical cancellation or future background-stop guarantee
  TaskAddonRef:
    schema_version: '0.1'
    candidate_location: backlog.tasks[].addon_refs[]
    required_fields:
    - addon_id
    - addon_version
    - form_id
    - form_ref
    field_meanings:
      form_ref: AddonResourceRef; must match same-version intent.addons.forms binding
    display_alias: addon/form@version is display only, not path/command resolution
    operation_checks:
    - current Task and approval version
    - same-version Layer explicit addon selection
    - guide/common contract/form fixed hashes and permitted reads
    - actual upstream evidence/current capabilities/permissions/finite allocation
    - existing writer/stop/quality gates for real execution
    update: 型改版を自動反映しない。影響Task/計画の版と許可を再照合
    missing_selected_ref: Hold; distinguish from unselected legacy route
    execution_permission_created: false
  RecurringTaskTemplate:
    schema_version: '0.1'
    added_in: '0.3'
    candidate_location: binding.guide_ref の案内ファイル内のブロック（`<!-- RECURRING_TEMPLATES:BEGIN -->` と `<!-- RECURRING_TEMPLATES:END -->` の間の YAML 本文。コードフェンスなし）
    optional: true
    block_root: '{recurring_templates: [RecurringTaskTemplate]}'
    max_items: 16
    fields:
      name:
        type: string
        required: true
        meaning: 運用タスクの名前の案。同じブロック内で重複しない
      recurrence:
        type: enum
        required: true
        values:
        - daily
        - weekly
        - per_meeting
        meaning: 02-inception の Task 欄 recurrence と同じ値。未知の値は拒否
      acceptance_criteria:
        type: list
        required: true
        meaning: 1回の run で確かめる AC の案（空でない文字列。1〜16件）
      description:
        type: string
        required: false
        meaning: 説明の案
    absent: ブロックが無い案内は雛形0件（従来どおり）。AddonBinding・manifest の欄は増やさない（v0.1 の AddonBinding は未知の欄を Hold にするため）
    invalid: 印の数の不一致・未知の欄・空の name・未知の recurrence・AC 空・name の重複・上限超えは Hold（雛形0件と理由を返す）。案内の本文で印の文字列（RECURRING_TEMPLATES:BEGIN/END）に触れると印の数の不一致で Hold になる
    change: 既存のアドオンの案内にブロックを足すのは案内の改版。guide の hash が変わるので binding を作り直す（作り直すまで既存の Task は Hold）
    trust: 案内本文と同じく作業データ。選択・登録・書き込み・実行の許可にしない
  RecurringTaskProposal:
    schema_version: '0.1'
    added_in: '0.3'
    route: inception_recurring
    produced_by: .claude/skills/ai-plc/scripts/plc_addon.py --stage inception_recurring（読み取りだけ。backlog・intent に書かない）
    task_fields:
      id: 仮の ID（R?）。本番の ID は Inception が backlog に書くときに付ける
      name: 雛形の name
      description: 雛形の description（無ければ省く）
      type: operation
      recurrence: 雛形の recurrence
      runs: '[]'
      status: pending
      dependencies: '[]'
      acceptance_criteria: 雛形の acceptance_criteria
    caller_fills:
    - id
    - priority
    - owner
    - estimated_hours
    - command
    - origin
    caller_must_keep: name は案のまま書く（出どころは description に書く）。duplicates の照合が name と recurrence で行うため
    recurring_task_rules:
    - 他の Task の依存先にしない（運用の結果を使う Task は初回の run の output を input に書く）
    - 自動完走（RUL_plc_session §10）では回さない
    - Operation で実行しても completed にせず runs に1行ずつ足す。status の値を増やさない
    registration: Inception の分解表に入れて本人の承認を取り、承認の後に backlog に書く。案の返却は承認・登録ではない
    duplicates: backlog.yaml に同じ name と recurrence の Task があれば案にせず already_in_backlog に挙げる
    execution_permission_created: false
  BundledAddonSelection:
    schema_version: '0.1'
    added_in: '0.4'
    candidate_location: intent.addons[]（source が bundled の1件。新しい Layer は PM の選択をこの1件だけで書き、work_style は書かない）
    required_fields:
    - addon_id
    - source
    - addon_version
    optional_fields:
    - selection_ref
    source_values:
    - bundled
    rules:
    - addon_id は目録（addon-catalog.yaml）に同じ addon_id の行があるときだけ有効。無ければ Hold（case が bundled を名乗って hash の照合を逃れる道を作らない）
    - 上の4欄以外（guide_ref・common_contract_ref・forms・read_limits・schema_version を含む）があれば Hold（形の混在を許さない）
    - source が bundled 以外の値は Hold。source を省いた1件は今どおり case の AddonBinding（v0.1）
    - hash を固定しない。本体と一緒に版上げし、本体の今の版で読む（addon-seam.md の「型・案内の改版を稼働中 Task へ自動反映しない」の例外。case は今どおり hash 固定）
    - addon_version が目録の版と違っても Hold しない。目録の版で読み、注意を1行返す。intent は書き換えない
    - selection_ref は選択の照合（selection_verified）に使う。認証・許可ではない。照合できなくても Hold しない
    case_processing: case の処理（plc_addon.py の全段・MAX_BINDINGS・1件の照合・addon_init）は source が bundled の1件を除いた一覧で行う。この除外は plc_addon.py の全段に入っている
  AddonCatalog:
    schema_version: '0.1'
    added_in: '0.4'
    location: .claude/skills/ai-plc/references/addon-catalog.yaml
    top_fields:
    - specification
    - schema_version
    - contract
    - exclusive_groups
    - addons
    group_fields:
    - meaning
    - max_selected
    - none_allowed
    - case_declaration
    - undeclared_case_with_member
    row_required:
    - addon_id
    - source
    - display_name
    - addon_version
    - exclusive_group
    - hash_pinned
    - entry
    - init
    - stage_reads
    row_optional:
    - settings_key
    - legacy_alias
    rules:
    - 載せるのは同梱アドオンだけ。顧客専用（持ち込み）の行は書かない
    - 未知の欄・重複の addon_id・未定義の組・source が bundled でない行は目録の誤りとして Hold
    - init は入口のスキルが行い、記録先（record）を宣言する。大元（Stage SKILL）にアドオン名を書かない
  AddonProfileDeclaration:
    schema_version: '0.1'
    added_in: '0.4'
    candidate_location: 持ち込み（case）のアドオンの common_contract_ref のファイル内のブロック（`<!-- ADDON_PROFILE:BEGIN -->` と `<!-- ADDON_PROFILE:END -->` の間の YAML 本文。コードフェンスなし）
    optional: true
    block_root: '{exclusive_group: <目録の組の名前> | none}'
    meaning: 方式として持ち込むアドオンが排他の組に入るか（none は組の外の明示）。ブロックが無い＝宣言なし
    read: 判定関数は common の実ファイルの sha256 が binding の固定値と一致してから宣言を読む。合わなければ Hold
    unreadable: 読取の root が渡されない・読めないときは宣言なしとして扱う
    undeclared: 宣言なしの持ち込みが組の1件（同梱の AIPM など）と一緒に選ばれたら Hold（本人の決定 2026-10-22）。組の1件が無ければ Hold しない
    invalid: 印の数の不一致・未知の欄・未知の組は Hold
    change: 宣言を足すのは common の改版。hash が変わるので binding を作り直す（作り直すまで既存の Task は Hold）。AddonBinding・manifest の欄は増やさない
    trust: 作業データ。選択・書き込み・実行の許可にしない
  LegacyAlias:
    schema_version: '0.1'
    added_in: '0.4'
    source: 目録の行の legacy_alias（例 intent_field work_style・value aipm・selection_source_field work_style_source）
    rules:
    - intent に旧い欄の値があり、addons に同じ同梱の1件が無ければ、その1件があるものとして読む（addon_version は目録の版、selection_ref は selection_source_field の値）。intent は書き換えない。一括の移行はしない
    - 旧い欄と同梱の1件の両方があれば同じ選択として扱う
    - 旧い欄が目録に無い値なら Hold（unsupported）。同梱の1件があって旧い欄が別の値なら Hold（conflict）
    - 解除は同梱の1件と旧い欄（selection_source_field を含む）の両方を消す。文書は残す
    - 同梱の設定（intent.aipm など settings_key の欄）と初期化の記録（mode_init）の置き場・意味は変えない
  AddonSelectionResult:
    schema_version: '0.1'
    added_in: '0.4'
    produced_by: .claude/skills/ai-plc/scripts/plc_addon_select.py の selected_addons（読み取りだけ。書き込まない）
    fields:
      route: selected | unselected | held
      method: 組 work_method から選ばれた1件の addon_id か null
      work_style_value: 読み替え後に PM が選ばれていれば aipm、無ければ null（値の集合は今の work_style と同じ）
      selected: '同梱の各件 {addon_id, source, via (legacy_alias|addons|both), addon_version, catalog_version, exclusive_group, entry, init_record, selection_ref, selection_verified, selection_basis}'
      case_addons: '持ち込みの各件 {addon_id, addon_version, exclusive_group (組の名前|none|null)}'
      has_case_addons: 補助スキル（plc-consult・plc-next・plc-backfill）の addon-seam.md の前置判定は、これが true のときだけ
      notes: Hold しない注意（版の差・選択の照合なし・宣言を読めない）
      hold_reasons: Hold の理由のコード（held のときだけ）
      detail: Hold の補足（held のときだけ。作業データ）
      writes: 'false'
    selection_verified: selection_ref が Layer の Context/ の下の実ファイルで、choice 欄を持つ JSON なら kind が user_reported で choice が addon_id と一致、それ以外は名前に selection を含み本文が addon_id を英数字の境目で区切られた語として名指しするとき true。照合は認証ではなく、false でも選択の扱いは変えない
    hold_reason_values:
    - invalid_catalog
    - invalid_intent
    - invalid_addons
    - invalid_case_binding
    - unsupported_work_style
    - work_style_conflict
    - bundled_not_in_catalog
    - bundled_invalid_fields
    - unknown_source
    - duplicate_bundled
    - exclusive_group_multiple
    - undeclared_case_with_method
    - case_profile_hash_mismatch
    - invalid_profile_declaration
    - invalid_input
    execution_permission_created: false
