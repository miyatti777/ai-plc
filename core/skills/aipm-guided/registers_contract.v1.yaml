# AIPM モードの案件側の一覧（registers）の契約。intent の aipm.registers: true のときだけ使う。
# format_schema.yaml（固定版の契約）は変えない。
version: 1
contract_suffix: '+registers.1'
root: registers
upstream_canonical_unchanged: true
files:
  hypotheses:
    path: registers/hypotheses.yaml
    top_required: [hypotheses]
    id_pattern: '^H\d+$'
    required: [id, kind, claim, status]
    optional: [issue_id, evidence, expected_value, risk_note, method, success, falsification, priority, due, legacy_ref, judgements]
    kind: [opportunity, problem, solution, validation]
    status: [unknown, not_supported, structurally_supported, supported]
    priority: [critical, high, medium]
    judgement:
      required: [date, event, verdict, judged_by]
      optional: [evidence_ref, note]
      verdict: [supported, not_supported, undetermined]
      judged_by: [owner, decider, ai_proxy]
  issues:
    path: registers/issues.yaml
    list_key: issues
    top_required: [charter, issues]
    charter_required: [change_conditions, exit_conditions]
    id_pattern: '^I\d+$'
    required: [id, question, status, priority]
    optional: [owner, due, answer, parent, reason, validation_plan, evidence_refs, decided_by, review_at]
    status: [open, resolved, not_needed, cancelled, on_hold]
    completion:
      each_issue: 'owner and due (a date or undecided) are present; rows whose status is in reason_statuses may instead give reason'
      reason_statuses: [not_needed, cancelled, on_hold]
      charter: 'change_conditions and exit_conditions are non-empty'
      warn_undecided_due: true
      warn_unknown_owner: '[unknown]'   # also warns when every charter condition is still [unknown]
    refs: {answer: hypotheses, validation_plan: hypotheses, parent: issues}
    ref_kinds: {validation_plan: validation}   # validation_plan points to validation hypotheses only
    single_refs: [parent]                       # parent is one id; self and cycles are rejected
    free_text_refs: [answer]                    # answer may be hypothesis ids or the answer in words; H<number> is checked, other id-like values only warn
    resolution:
      resolved_requires: [answer, evidence_refs, decided_by]
      decided_by: [owner, decider]
      evidence_refs: 'hypothesis ids whose owner/decider judgement has an actual-user receipt, or Layer-relative paths to an actual-user receipt or a decision record (YAML with kind: decision_record, decided_by owner/decider, decided_at, decision, scope_id)'
      reason_required: [not_needed, cancelled, on_hold]
      review_at_required: [on_hold]
      not_counted: [not_needed, cancelled, on_hold]   # resolved_ratio = resolved / (all - not_counted)
      done_work: {todo: [done], backlog: [completed]}  # work linked by todo.source or backlog task issue_id
  todo:
    path: registers/todo.yaml
    list_key: todo
    top_required: [todo]
    id_pattern: '^D\d+$'
    required: [id, title, status, owner]
    optional: [source, wbs_id, due, priority, note, source_of_truth]
    status: [todo, doing, done, cancelled]
    refs: {wbs_id: wbs}
    source_refs: {I: issues, H: hypotheses}     # source may be I/H ids (checked) or free text such as a meeting name
  wbs:
    path: registers/wbs.yaml
    list_key: wbs
    top_required: [wbs]
    id_pattern: '^W\d+(\.\d+)*$'
    required: [id, deliverable, exit_criteria, owner, status]
    optional: [gate, evidence_refs, issue_ids, milestone_id, depends, schedule, source_of_truth]
    status: [draft, planned, pending_acceptance, partially_accepted, accepted, cancelled]
    refs: {issue_ids: issues, milestone_id: roadmap, depends: wbs}
    acceptance:
      needs_evidence: [accepted, partially_accepted]   # evidence_refs: Layer-relative paths (task outputs) or H ids
      candidate: pending_acceptance                    # the furthest an AI or wbs-candidate may set; accepted is set by a person
    schedule:
      keys: [baseline, forecast, actual, history]
      baseline_agreement: [agreed_at, agreed_by, scope]   # baseline without these is only a forecast (warning)
      range: [start, end]
  roadmap:
    path: registers/roadmap.yaml
    list_key: roadmap
    top_required: [roadmap]
    id_pattern: '^MS\d+$'
    required: [id, milestone, period, status]
    optional: [wbs_ids, note]
    status: [draft, planned, reached, cancelled]
    refs: {wbs_ids: wbs}   # roadmap.wbs_ids and wbs.milestone_id must agree in both directions
task_links:
  wbs_id: '^W\d+(\.\d+)*$'      # AI-PLC backlog tasks; 'none' marks a task that maps to no deliverable
  issue_id: '^I\d+$'
  warn_missing_wbs_for: 'non-cancelled tasks with output, except type management/coordination and wbs_id: none'
source_of_truth: [local]          # external sources are not supported yet
init_drafts:
  note: 'package.py init writes these minimal drafts (required keys only) when aipm.registers is true; existing files are never overwritten'
  wbs_initial_deliverables:
    - {deliverable: 調査結果, exit_criteria: 必要な問いに対する証拠と不足が整理されている}
    - {deliverable: 課題と仮説, exit_criteria: 課題・前提・反証条件・検証結果／未実施が区別されている}
    - {deliverable: 関係者判断, exit_criteria: 提示対象・判断事項・実回答／保留が記録されている}
    - {deliverable: 解決案, exit_criteria: 課題と検証に結びついた解決仮説・採否・根拠がある}
    - {deliverable: 実現と検証, exit_criteria: 対象成果が実現・検証され、必要な受入／引継ぎがある}
rules:
  supported_needs_human: 'status supported requires a judgement by owner or decider'
  human_judgement_needs_receipt: 'owner/decider judgements require evidence_ref (the step 8 actual-user receipt)'
  ai_proxy_is_proposal: 'ai_proxy judgements never change status by themselves'
  validation_ids: 'every validation_record hypothesis id exists here with kind validation (an opportunity id is a collision)'
  minimal_lists: 'issues/todo/wbs/roadmap are checked for required keys, id format, unique ids and status values only; optional keys are added by later tasks'
  validation_result_match: 'rows without an owner/decider judgement keep status equal to validation_record result; rows with one may differ because validation_record is fixed at archive'
display_ja:
  kind: {opportunity: Opportunity 仮説, problem: 課題の仮説, solution: 解決策の仮説, validation: 検証の仮説}
  status: {unknown: 未判定, not_supported: 反証, structurally_supported: 構造上は支持, supported: 支持}
  verdict: {supported: 支持, not_supported: 反証, undetermined: 判定不能}
  judged_by: {owner: 本人, decider: 判断者, ai_proxy: AI の代理}
  issue_status: {open: 未解決, resolved: 解決, not_needed: 検討不要, cancelled: 中止, on_hold: 保留}
