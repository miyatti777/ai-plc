adaptations:
- id: D1
  source: mixed Flow/<today>/patterns.flow_date/3_discovery
  target: explicit internal flow_rel / folder
  reason: 同Projectに束縛し外部を触らない
- id: D2
  source: 3件固定のPH/PR/SL/STとViewer例のP002/ST004
  target: 実証された件数1以上、P002/cross例は削除せずrawテンプレート保持、実文書は不要例を生成しない
  reason: 構造を保ち架空事実を作らない
- id: D3
  source: age_gender/occupation/company_context
  target: キー保持、[unknown]値を明示。原文末尾のSense+Focusベース表現を実際の質問ベース出典へ読み替え
  reason: 実データの出典へ合わせる
- id: D4
  source: question branch hypotheses mappingコメントのみ/priority空欄
  target: 空map/空listへ正規化、仮説はAIPLC別検証記録
  reason: 型を明確にし事実の欠落と空集合を区別
- id: D5
  source: Summaryの1〜3ヶ月の検証見出し/固定検証例
  target: 見出しは参照形式として保持、今回の各節に局所確認・未確認と対象外の期間を記述
  reason: 計画を実施済みと偽らない
- id: D6
  source: viewer_story_map型とST-001 /後工程integrated_story_map
  target: Viewerは別YAML、traceはST1。id_mappingをmanifestへ。後工程aliasは未使用なので作らない
  reason: 暗黙形式変換をしない
- id: D7
  source: persona末尾旧単一出力
  target: 今回はgenerate_all_personasの質問branch。legacy aliasは作らずsource mappingに未採用理由を残す
  reason: 原文分岐を固定し重複を避ける
- id: D8
  source: share_repo固定/提出コマンド次案内
  target: 14キーと憲章節保持、share値はdisabled。次工程はLayer内、公開提出無効
  reason: 送信/公開未許可
- id: D9
  source: proposed→wait→確定
  target: proposed内容は同形式の候補履歴として保持、Goal自動判断をauto_decisionと記録。実本人回答と別
  reason: 無回答を本人確認としない
additional_records:
  manifest: manifest.yaml
  validation: validation_record.yaml
  required_evidence_labels:
  - user_reported
  - observed
  - hypothesis
  - inference
  - unknown
  human_confirmation_policy: Require actual-user source receipt with kind/actor/origin/question_id/thread/time
    and matching stage-required target document; no hypothesis/quote promotion. Independent
    reviewer verifies provenance, code does not authenticate real-world identity.
  manifest_schema:
    required:
    - scope_id
    - source_commit
    - contract_version
    - branch
    - flow_rel
    - stock_project_rel
    - id_mapping
    - completion_claim
    - stages
    - evidence
    - records
    completion_claim: local_trial_only; new human readability/effectiveness unknown
    branch: question_based/single_persona
    stages: ordered init/persona/problem/validation/solution/story/archive; each has
      started_at/finished_at/checkpoint_actor/checkpoint_status/evidence_refs
    evidence: list{id,kind,source,source_sha256,scope}; kind in five declared labels;
      source relative to Layer and hash-match, no invented interview
    records: list{path,source_step,template_sha256,version,branch,stage,status,requires_human,human_state,inputs,evidence_refs,decision,sha256,generated_mtime_ns,archive_path,archive_sha256};
      path/archival targets inside package; all required documents exactly once
    status_allowed:
    - draft
    - generated
    - validated_local_final
    - archived_local_final
    - blocked
    human_state_allowed:
    - not_required
    - confirmed_actual
    - pending
    completed_package_state: Flow stage docs archived_local_final with matching Stock
      bytes; Init/README validated_local_final; no draft/blocked/pending requires_human
      allowed
    version: nonempty string
    generated_state_transition: draft→generated→validated_local_final→archived_local_final;
      requires_human+pending→blocked; validation/drafts remain distinct
    archive_condition: Only source-contract/source ID/labels checks passed and no
      required real-user decision pending. auto_decision on local reversible output
      is recorded as auto, never as actual human.
    human_responses: optional map stage -> {source,source_sha256,answer,target_path,target_sha256};
      source is Context YAML actual_user_reply receipt with scope_id/stage/kind=user_reported/actor=actual_user/question_id/source_thread_id/received_at;
      same source in user_reported evidence; target is that stage required document
      and hash matches actual bytes/checkpoint_targets
    checkpoint_targets: optional map stage -> actual target document SHA256
  validation_schema:
    required:
    - scope_id
    - before_solution
    - hypotheses
    - evidence_refs
    - actual_new_user_response
    - limits
    before_solution: true only if written in validation stage before any solution
      stage output
    hypotheses: list{id,kind,claim,method,success,falsification,result,scope}; kind=hypothesis;
      result unknown/not_supported/structurally_supported, no general effect
    actual_new_user_response: null unless a typed actual-user validation receipt matches
      its answer and required target; psychological effects remain unknown
    limits: psychological effect/new-user understanding unmeasured; structural fixtures
      are separate
  fixture_oracles:
  - name: normal
    mutation: valid independently authored synthetic minimal package
    expect: pass, empty errors
  - name: missing
    mutation: remove problem_map.yaml
    expect: fail E_MISSING with missing path
  - name: format
    mutation: replace a story acceptance list with string
    expect: fail E_SCHEMA at acceptance; a duplicate YAML key also must fail
  - name: reference
    mutation: point an SL link to absent PR999
    expect: fail E_REF with unresolved PR999
  - name: order
    mutation: solution before validation in stages
    expect: fail E_ORDER
  - name: archive
    mutation: change Stock bytes without Flow change
    expect: fail E_ARCHIVE or E_HASH
  - name: checkpoint
    mutation: requires_human=true + human_state=pending
    expect: fail E_CHECKPOINT; not archive as locally final
  - name: boundary
    mutation: symlink required file outside package
    expect: fail E_BOUNDARY before reading target
  validation_checkpoint: 'optional immutable validation_checkpoint.yaml: validation
    record excluding actual_new_user_response, written before actual reply; final
    question content must still match'
checks:
- required_files_and_folders
- YAML_recursive_schema
- Markdown_source_headings
- Mermaid_closed_fence_and_IDs
- no_unrendered_placeholders
- referential_integrity_and_duplicate_IDs
- evidence_labels_and_refs
- stage_order
- internal_root_and_symlinks
- manifest_hash_and_archived_bytes
trial_limit: Common structural contract. Single persona Init/Discovery01–04; no native
  registration, Viewer E2E or psychological effect guarantee.

